llm:
  provider: "openai-compatible"
  # The key is read from this environment variable. Avoid storing secrets here.
  api_key_env: "OPENAI_API_KEY"
  # OPENAI_BASE_URL overrides this value when set.
  base_url_env: "OPENAI_BASE_URL"
  base_url: "https://api.openai.com/v1"
  model: "gpt-4.1"
  max_tokens: 32768
  # Set low/medium/high only for providers and models that support it.
  reasoning_effort: null
  request_timeout_seconds: 180
  retry_timeout_seconds: 600
  max_concurrent_requests: 10
  retry_attempts: 7
  retry_delay_seconds: 5.0

pipeline:
  concurrency: 3
  cache_dir: ".cache/llm_responses"
  output_dir: "output"

code_visitation:
  enabled: true
  repo_cache_dir: ".cache/repos"
  clone_timeout_seconds: 120
  max_source_context_lines: 200
