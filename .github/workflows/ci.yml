name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff + mypy (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev/structural extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,structural]

      - name: Strict type check release and study scripts
        run: |
          mypy --strict scripts/audit_supply_chain.py scripts/lock_literature.py
          mypy --strict scripts/build_release_dossier.py
          mypy --strict scripts/capture_release_evidence.py
          mypy --strict scripts/verify_claim_ledger.py
          mypy --strict tests/test_capture_release_evidence.py
          mypy --strict tests/test_release_dossier.py
          mypy --strict experiments/hosted_outcome_study/run_study.py
          mypy --strict experiments/matched_rollout_study/run_study.py
          mypy --strict experiments/real_agent_pilot/run_pilot.py
          mypy --strict experiments/seed_study/run_seed_study.py
          mypy --strict experiments/independent_execution_smoke/run_smoke.py
          mypy --strict experiments/paired_execution_smoke/verify_evidence.py tests/test_paired_execution_smoke.py
          mypy --strict experiments/sphinx_execution_smoke/verify_evidence.py tests/test_sphinx_execution_smoke.py
          mypy --strict --explicit-package-bases experiments/prospective_pilot/review_packets.py tests/test_prospective_review_packets.py
          mypy --strict --explicit-package-bases experiments/prospective_pilot/scheduler.py experiments/prospective_pilot/proposal_policy.py experiments/prospective_pilot/target_policies.py experiments/prospective_pilot/analysis.py tests/test_prospective_scheduler.py tests/test_prospective_proposal_policy.py tests/test_prospective_target_policies.py tests/test_prospective_analysis.py
          mypy --strict --explicit-package-bases experiments/prospective_pilot/ledger.py experiments/prospective_pilot/dispatcher.py experiments/prospective_pilot/release_bundle.py tests/test_prospective_ledger.py tests/test_prospective_dispatcher.py tests/test_prospective_release_bundle.py
          mypy --strict --explicit-package-bases experiments/prospective_pilot/scientific_ledger.py tests/test_prospective_scientific_ledger.py tests/test_prospective_scientific_export.py
          mypy --strict --explicit-package-bases experiments/prospective_pilot/validate_protocol.py

      - name: Release and research contract CLIs
        run: |
          python scripts/build_release_dossier.py --help
          python scripts/capture_release_evidence.py --help
          python scripts/verify_claim_ledger.py
          python experiments/independent_execution_smoke/run_smoke.py
          python experiments/paired_execution_smoke/verify_evidence.py
          python experiments/sphinx_execution_smoke/verify_evidence.py
          python experiments/prospective_pilot/review_packets.py --help
          python experiments/prospective_pilot/validate_protocol.py
          pytest tests/test_release_dossier.py tests/test_capture_release_evidence.py tests/test_independent_execution_smoke.py tests/test_paired_execution_smoke.py tests/test_sphinx_execution_smoke.py tests/test_prospective_preregistration.py tests/test_prospective_review_packets.py tests/test_prospective_proposal_policy.py tests/test_prospective_ledger.py tests/test_prospective_dispatcher.py tests/test_prospective_release_bundle.py tests/test_prospective_scientific_ledger.py tests/test_prospective_scientific_export.py -q --tb=short

      - name: Quality gates + canonical release evidence (Python ${{ matrix.python-version }})
        # Tests are designed not to call external APIs, and any test that
        # exercises the LLM uses tests.conftest.FakeLLMClient. Runner egress is
        # not blocked. We do NOT set
        # PYTEST_DISABLE_PLUGIN_AUTOLOAD — pytest-asyncio is loaded via the
        # standard entry-point mechanism (see pyproject.toml dev extras).
        run: |
          python scripts/capture_release_evidence.py quality \
            --repo-root . \
            --output "$RUNNER_TEMP/bench-cleanser-quality"

      - name: Preserve canonical quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-cleanser-quality-${{ github.sha }}-attempt-${{ github.run_attempt }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/bench-cleanser-quality
          if-no-files-found: error
          retention-days: 90

  package:
    name: build + clean-wheel + supply-chain gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned release-gate tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[release]"

      - name: Build, clean-install, emit SBOM, and enforce policy
        run: |
          BC_CAPTURE_RELEASE_EVIDENCE=1 scripts/run_supply_chain_gate.sh \
            "$RUNNER_TEMP/bench-cleanser-wheel" \
            "$RUNNER_TEMP/bench-cleanser-dist"
          echo "BC_TARGET=$RUNNER_TEMP/bench-cleanser-wheel" >> "$GITHUB_ENV"
          echo "BC_DIST=$RUNNER_TEMP/bench-cleanser-dist" >> "$GITHUB_ENV"

      - name: List machine-readable supply-chain outputs
        run: |
          find "$BC_DIST/supply-chain" -maxdepth 1 -type f -print -exec sha256sum {} \;

      - name: Smoke installed entry points outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          BIN="$BC_TARGET/bin"
          "$BIN/bench-cleanser" --version
          "$BIN/bench-cleanser" --help
          "$BIN/bench-cleanser-trajectory" --help
          "$BIN/bench-cleanser-deep-dive" --help
          "$BIN/bench-cleanser-acquire" --help
          "$BIN/bench-cleanser-corpus" --help
          "$BIN/bench-cleanser-evaluate" --help
          "$BIN/bench-cleanser-manifest" --help
          "$BIN/bench-cleanser-route" --help
          printf '' | "$BIN/bench-cleanser-manifest" ci-candidate - \
            --stage training --provenance ci=github-actions \
            | "$BIN/bench-cleanser-route" -

      - name: Preserve exact release-gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-cleanser-release-gate-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bench-cleanser-dist
          if-no-files-found: error
          retention-days: 90

  release-evidence:
    name: bind successful Linux CI evidence
    needs: [test, package]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Python 3.11 quality evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bench-cleanser-quality-${{ github.sha }}-attempt-${{ github.run_attempt }}-py3.11
          path: ${{ runner.temp }}/bench-cleanser-quality-3.11

      - name: Download Python 3.12 quality evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bench-cleanser-quality-${{ github.sha }}-attempt-${{ github.run_attempt }}-py3.12
          path: ${{ runner.temp }}/bench-cleanser-quality-3.12

      - name: Download package and supply-chain evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bench-cleanser-release-gate-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bench-cleanser-dist

      - name: Bind the successful matrix and release artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/bench-cleanser-ci"
          python scripts/capture_release_evidence.py linux-ci \
            --repo-root . \
            --artifact-directory "$RUNNER_TEMP/bench-cleanser-dist" \
            --artifact-report "$RUNNER_TEMP/bench-cleanser-dist/supply-chain/artifact-audit-report.json" \
            --quality-evidence "$RUNNER_TEMP/bench-cleanser-quality-3.11" \
            --quality-evidence "$RUNNER_TEMP/bench-cleanser-quality-3.12" \
            --output "$RUNNER_TEMP/bench-cleanser-ci/linux-ci.json"

      - name: Preserve complete release-dossier inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-cleanser-release-dossier-inputs-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bench-cleanser-quality-3.11
            ${{ runner.temp }}/bench-cleanser-quality-3.12
            ${{ runner.temp }}/bench-cleanser-dist
            ${{ runner.temp }}/bench-cleanser-ci
          if-no-files-found: error
          retention-days: 90
