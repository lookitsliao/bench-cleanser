[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "bench-cleanser"
version = "0.1.0"
description = "Experimental benchmark auditing and risk-adaptive verification for SWE agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "v-liaozhu" }]
keywords = [
    "swe-bench",
    "benchmark",
    "contamination",
    "evaluation",
    "llm",
    "agent",
    "ai-safety",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "datasets>=2.14.0",
    "openai>=1.54.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
structural = ["tree-sitter-language-pack==0.9.1"]
dev = [
    "build>=1",
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4",
    "ruff>=0.4",
    "mypy>=1.10",
    "twine>=5",
]
release = [
    "build>=1,<2",
    "cyclonedx-bom==7.3.0",
    "detect-secrets==1.5.0",
    "hatchling>=1.18,<2",
    "packaging>=24,<27",
    "pip-licenses==5.5.5",
    "twine>=5,<7",
]

[project.urls]
Homepage = "https://github.com/v-liaozhu/bench-cleanser"
Repository = "https://github.com/v-liaozhu/bench-cleanser"
Issues = "https://github.com/v-liaozhu/bench-cleanser/issues"
Changelog = "https://github.com/v-liaozhu/bench-cleanser/blob/master/CHANGELOG.md"

[project.scripts]
bench-cleanser = "bench_cleanser.cli:main"
bench-cleanser-trajectory = "bench_cleanser.cli:trajectory_main"
bench-cleanser-deep-dive = "bench_cleanser.cli:deep_dive_main"
bench-cleanser-acquire = "bench_cleanser.verification.acquire:main"
bench-cleanser-corpus = "bench_cleanser.verification.corpus:main"
bench-cleanser-evaluate = "bench_cleanser.verification.evaluate:main"
bench-cleanser-manifest = "bench_cleanser.verification.manifest:main"
bench-cleanser-route = "bench_cleanser.verification.route:main"

[tool.hatch.build]
exclude = [
    "/copilot-codex-claude-bootstrap.sh",
    "/scripts/codex",
    "/tmp",
]

[tool.hatch.build.targets.wheel]
packages = ["bench_cleanser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    # bench_cleanser.models declares Test* dataclasses (TestVerdict,
    # TestAnalysis, TestedFunction, …) that are domain entities, not pytest
    # classes. Suppress the resulting collection warnings rather than
    # renaming a public API.
    "ignore::pytest.PytestCollectionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["output*", "audits", "case_studies", "slides", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function calls in argument defaults (Pydantic Field)
    "E731",   # lambda assignment (occasionally clearer than def)
    "E741",   # ambiguous variable names (l, I, O) — common in math/logic code
    "F541",   # f-strings without placeholders — fine when used for parity
    "B904",   # `raise X from Y` — fine to leave bare in narrow contexts
    "B905",   # `zip(..., strict=...)` — verbose for simple paired iteration
    "B007",   # loop variable not used in body — fine for index-only loops
    "UP006",  # PEP 585 (list[str] etc.) — already used; some legacy spots remain
    "UP007",  # PEP 604 (X | None) — same
    "UP037",  # quoted annotations — left intentionally where forward refs help
    "UP042",  # StrEnum migration — deliberate (str, Enum) for legacy JSON serialization
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "F841"]
"bench_cleanser/__init__.py" = ["F401"]   # re-exports
"bench_cleanser/code_visitor.py" = ["E402"]   # internal forward-decl import pattern

[tool.mypy]
python_version = "3.11"
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
